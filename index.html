<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>时空围棋 TimeGo</title>
  <link rel="stylesheet" href="static/style.css?v=5" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>时空围棋 · TimeGo</h1>
      <div class="subtitle">25×25 · 回溯 · 时痕子 · 时间线分岔 · 毁灭性共振</div>
    </header>

    <main class="layout">
      <section class="board-wrap">
        <canvas id="board" width="600" height="600"></canvas>
        <div id="hint" class="hint">黑方回合: 点击棋盘落子</div>
      </section>

      <aside class="sidebar">
        <div class="panel">
          <h2>状态</h2>
          <div id="status"></div>
        </div>

        <div class="panel">
          <h2>操作</h2>
          <div class="btns">
            <button id="btn-backtrack" type="button">回溯</button>
            <button id="btn-pass" type="button">弃权</button>
            <button id="btn-resign" type="button">认输</button>
            <button id="btn-end" type="button">声明终局</button>
            <button id="btn-mode" type="button">模式: 人机</button>
            <button id="btn-new" type="button">新对局</button>
          </div>
        </div>

        <div class="panel">
          <h2>着手记录 <span class="tip">(回溯时点击自己下过的手作为母手)</span></h2>
          <div id="history" class="history"></div>
        </div>

        <div class="panel">
          <h2>时间线 <span class="tip">(点击切换查看)</span></h2>
          <div id="timeline" class="timeline"></div>
        </div>

        <div class="panel">
          <h2>事件日志</h2>
          <div id="log" class="log"></div>
        </div>
      </aside>
    </main>
  </div>

  <!-- 回溯选择弹窗: 列出活动时间线所有着手, 从上到下显示第几手 -->
  <div id="bt-modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-head">
        <h3>选择回溯母手</h3>
        <button id="bt-close" class="modal-close" type="button">×</button>
      </div>
      <div class="modal-sub">活动时间线 <span id="bt-tl-id">#0</span> · 仅可选择你自己下过且未锁定的手</div>
      <div id="bt-moves" class="bt-move-list"></div>
      <div class="modal-foot">
        <div id="bt-tip" class="bt-tip">点击上方任意一手作为回溯母手</div>
        <button id="bt-cancel" class="btn btn-ghost" type="button">取消</button>
      </div>
    </div>
  </div>

  <!-- 加载顺序: 引擎 -> AI -> UI -> 主入口 (全局类, 非 ES module, 兼容 file://) -->
  <script src="static/engine.js?v=5"></script>
  <script src="static/ai.js?v=5"></script>
  <script src="static/ui.js?v=5"></script>
  <script src="static/script.js?v=5"></script>
</body>
</html>
